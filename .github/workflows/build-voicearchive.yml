name: Build VoiceArchive APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate Android project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d voicearchive.project.b64 | tar -xz
          cp -a VoiceArchiveAndroid/. .
          rm -rf VoiceArchiveAndroid
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace('repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); ', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Lint and build release APK
        shell: bash
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/voicearchive-release.jks \
            -storepass VoiceArchive_2026_Sign \
            -keypass VoiceArchive_2026_Sign \
            -alias voicearchive \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -sigalg SHA256withRSA \
            -dname "CN=VoiceArchive, OU=Mobile, O=VoiceArchive, L=Baku, C=AZ"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/VoiceArchive-v1.1.0-release.apk
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/voicearchive-release.jks \
            --ks-key-alias voicearchive \
            --ks-pass pass:VoiceArchive_2026_Sign \
            --key-pass pass:VoiceArchive_2026_Sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$UNSIGNED"

      - name: Verify release security and package
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/VoiceArchive-v1.1.0-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.openai.voicearchive'" /tmp/badging.txt
          grep -q "versionName='1.1.0'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.openai.voicearchive.MainActivity'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.RECORD_AUDIO'" /tmp/badging.txt
          ! grep -q "android.permission.INTERNET" /tmp/badging.txt
          ! grep -q "application-debuggable" /tmp/badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/signature.txt

      - name: Install and launch release on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            APK=app/build/outputs/apk/release/VoiceArchive-v1.1.0-release.apk
            adb install -r "$APK"
            adb shell pm grant com.openai.voicearchive android.permission.RECORD_AUDIO
            adb shell am start -n com.openai.voicearchive/.MainActivity
            sleep 5
            adb shell pidof com.openai.voicearchive
            adb shell dumpsys package com.openai.voicearchive | grep -q "android.permission.RECORD_AUDIO: granted=true"

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceArchive-v1.1.0-release
          path: app/build/outputs/apk/release/VoiceArchive-v1.1.0-release.apk
          if-no-files-found: error
