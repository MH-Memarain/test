name: Build ARNIKA SESSION 1.2.0

on:
  push:
    branches: [ main ]
    paths:
      - 'arnika_android/**'
      - '.github/workflows/build-arnika-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: arnika_android
        shell: bash
        run: gradle --no-daemon :app:assembleRelease

      - name: Lint release
        working-directory: arnika_android
        shell: bash
        run: gradle --no-daemon :app:lintRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/arnika-release.jks \
            -storepass Arnika_2026_Release \
            -keypass Arnika_2026_Release \
            -alias arnika \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -sigalg SHA256withRSA \
            -dname "CN=ARNIKA SESSION, OU=Mobile, O=ARNIKA SESSION, C=AZ"
          UNSIGNED=arnika_android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=arnika_android/app/build/outputs/apk/release/ARNIKA_SESSION_v1.2.0.apk
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/arnika-release.jks \
            --ks-key-alias arnika \
            --ks-pass pass:Arnika_2026_Release \
            --key-pass pass:Arnika_2026_Release \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$UNSIGNED"

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=arnika_android/app/build/outputs/apk/release/ARNIKA_SESSION_v1.2.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/arnika-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/arnika-badging.txt
          grep -q "package: name='com.arnika.session'" /tmp/arnika-badging.txt
          grep -q "versionName='1.2.0'" /tmp/arnika-badging.txt
          grep -q "launchable-activity: name='com.arnika.session.SplashActivity'" /tmp/arnika-badging.txt
          grep -q "uses-permission: name='android.permission.RECORD_AUDIO'" /tmp/arnika-badging.txt
          ! grep -q "application-debuggable" /tmp/arnika-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/arnika-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/arnika-signature.txt

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r arnika_android/app/build/outputs/apk/release/ARNIKA_SESSION_v1.2.0.apk
            adb shell pm grant com.arnika.session android.permission.RECORD_AUDIO
            adb shell am start -n com.arnika.session/.SplashActivity
            sleep 8
            adb shell pidof com.arnika.session
            adb shell dumpsys package com.arnika.session | grep -q "android.permission.RECORD_AUDIO: granted=true"

      - name: Upload ARNIKA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARNIKA_SESSION_v1.2.0_APK
          path: arnika_android/app/build/outputs/apk/release/ARNIKA_SESSION_v1.2.0.apk
          if-no-files-found: error
